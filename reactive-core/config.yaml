# reactive-core parameters (flat keys). Override any value on the command line:
#   python3 run.py --set step_limit=0.20 --set wall_side=right
# Values come from the design spec (docs/specs/2026-11-20-reactive-nav-design.md).

# ---- sensing (spec section 5) ----
mount_xyz: [0.18678, 0.0, 0.12498]   # base_link -> livox_frame, from /tf_static (session 1)
mount_pitch_deg: 15.0                # replaced by /tf_static when it arrives
near_drop_m: 0.30                    # drop points this close to the sensor (zero-range blob; 0.15 let the front legs in: 103 vs 32 front stops replaying run 113959)
max_range_m: 6.0
patch_m: 0.30                        # local-ground patch size
ground_pct: 10                       # local ground = this percentile of a patch's heights
step_limit: 0.25                     # higher than this above local ground = obstacle (tune practice day 1)
obs_h_max: 1.20                      # above local ground; higher returns (ceiling) ignored
n_min: 5                             # points needed in a cell to call it an obstacle
obs_cell_m: 0.10
persist_k: 1                         # obstacle cell must be seen in persist_k ... (1/1 = off, 2026-11-23)
persist_n: 1                         # ... of the last persist_n scans
body_h_default: 0.32                 # base_link height above the floor until the legs give one (floor_src fixed: always)
floor_src: legs                      # legs = body height from /joint_states (follows the controller height) | fixed
thigh_m: 0.20                        # Lite3_rl_deploy lite3_control_parameters.cpp
shank_m: 0.21
leg_h_add: 0.0                       # added to the leg height (foot radius, hip offset)
stairs_trust_m: 0.80                 # STAIRS mode: a patch's own ground is trusted within this of the stance floor

# ---- FAST-LIO local map (replaces the short-term obstacle memory, 2026-11-23) ----
lio_restart: true                    # run.py stops any running FAST-LIO and starts a fresh one per run (not with --sim)
lio_cmd: ros2 launch lite3_launcher fast_lio.launch.py
lio_topic: /fastlio/odometry         # nav_msgs/Odometry, lidar pose in lidar_init
lio_wait_s: 10.0                     # start-up waits this long for the first FAST-LIO pose (else: live scan only)
lio_blind_m: 0.50                    # map stores no point nearer than this to the sensor (own legs; FAST-LIO blind)
lio_voxel_m: 0.05
lio_radius_m: 3.0                    # map kept within this of the dog ...
lio_time_s: 30.0                     # ... and this long
lio_max_speed: 1.0                   # FAST-LIO pose faster than this (0.3 s window) = diverged -> map off for the run
lio_jump_m: 0.50                     # ... or one pose step longer than this
lio_stale_s: 0.50                    # map not used when the latest pose is older than this

# ---- leg odometry (grid, progress check) ----
odom_topic: /leg_odom
odom_type: pose                      # pose = PoseWithCovarianceStamped (/leg_odom) | odometry = nav_msgs/Odometry (/leg_odom2)
odom_jump_m: 0.30
yaw_source: gyro                     # gyro (integrated /imu/data, started from the first odom yaw) | odom
odom_speed_factor: 1.5
odom_speed_add: 0.30

# ---- lanes / driving (spec section 6) ----
lane_w: 0.60                         # start bay walls at +0.45 / -0.55 m (run 20261123_034135): ~0.9 m free
lane_w_min: 0.50
lane_d: 1.0
lane_fov_deg: 135                    # lanes evaluated within +-this (the rear is blind)
lane_step_deg: 15
rate_hz: 10.0                        # driver decisions
cmd_rate_hz: 20.0                    # command output
cruise_vx: 0.20
cruise_vx_min: 0.20                   # = cruise_vx: constant speed
# turn on the spot OR walk straight, never both (2026-11-23: slips at ledges while doing both)
turn_wz: 0.40
turn_wz_min: 0.20                    # turn rate in the last turn_slow_deg (the dog answers ~0.3 s late)
turn_slow_deg: 20                    # below this heading error the turn slows towards turn_wz_min
head_err_turn_deg: 10                # walking straight: heading error above this -> stop, turn on the spot
turn_done_deg: 4                     # ... until the error is below this (also the stairs approach)
commit_s: 2.0
blocked_confirm_n: 3                 # BLOCKED ends only when a lane is free this many decisions in a row (061517: one-scan flickers -> dither)
blocked_memory_s: 5.0                # BLOCKED again within this: keep the turn direction and the turned angle (no left-right-left)
wall_side: left                     # left | right (arenas are mirrored)
wall_dist_m: 0.60
side_switch_s: 60.0                  # no new grid cell for this long -> switch wall side
progress_s: 3.0
progress_ratio: 0.2
run_time_s: 0.0                      # > 0: HOLD after this many seconds (0 = off)

# ---- guard (spec section 7): stale feeds, tilt, no reverse, front stop - nothing else ----
stop_m: 0.24                         # from the sensor: nose ~0.14 m ahead of it -> ~0.10 m nose gap
guard_corridor_margin_m: 0.05
footprint_w: 0.42                    # front-stop corridor width (+ margin)
stale_s: 0.30
tilt_stop_deg: 45                    # above: zero command (flat and stairs) ... (35 was too close: sim descent peaks 32-35 deg)
tilt_resume_deg: 40                  # ... until below this, then it drives on by itself. Must stay above the pitch of a dog
                                     # standing on the stairs (real 27-31, sim up to ~35 deg), or it never resumes there
tilt_latch_deg: 60                   # above: the dog is going over - stopped until restart

# ---- grid (spec section 8) ----
cell_m: 1.0

# ---- stairs (spec section 9) ----
stairs: climb                        # off | detect | climb
stair_rise_min: 0.08
stair_rise_max: 0.20
stair_min_rises: 2
stair_bin_m: 0.05                    # fine bins: riser faces fall into short runs that are dropped
stair_tread_min: 0.15                # a plateau reached by a rise must be this long (wall faces are shorter)
stair_persist: 5
stair_start_excl_m: 1.5
stair_standoff_m: 0.60
stair_look_s: 2.0
stair_vx_up: 0.15
stair_vx_down: 0.10
stair_flat_exit_m: 1.0
stair_max_s: 90.0
stair_no_progress_s: 3.0
stair_hold_err_deg: 15               # climb / descend walk straight, never turn on a step: heading error above this -> HOLD (stays in AI)

# ---- navigation: frontier planner (2026-11-25, branch testing) ----
# nav_mode planner: a heading hint from the frontier planner (rc/planner.py) picks the free lane closest to the
# path; without a hint the dog goes straight if it can, else the smallest turn (no more "leftmost lane").
# nav_mode wall: the old left/right wall following (kept for comparison).
nav_mode: planner                    # planner | wall
plan_res_m: 0.10
plan_half_m: 15.0                    # grid covers +-this around the start (odometry frame)
plan_window_m: 6.0                   # Dijkstra window around the dog
plan_hz: 2.0
plan_fov_deg: 135                    # ray-cast field of view (the rear is blind)
plan_seen_r_m: 2.5                   # cells up to this far (or the first obstacle) count as seen
plan_near_seen_m: 1.0                # disc around the dog counted as seen free ground
plan_inflate_m: 0.30                 # obstacle clearance for the path
plan_front_min_m: 0.8                # frontiers nearer than this are ignored
plan_turn_cost: 1.0                  # metres of cost per rad of turn towards a frontier
plan_commit_s: 4.0
plan_lookahead_m: 1.0
plan_external_s: 1.5                 # an external (Nav2) path older than this is ignored
plan_max_dev_deg: 50                 # a free lane further than this from the hint is not used for it

# ---- low bar / cylinder (rc/bar.py; the driver crosses it square and slowly) ----
bar: cross                           # off | detect | cross
bar_h_min: 0.10
bar_h_max: 0.32
bar_depth_max: 0.35                  # deeper (the 0.5 m slab of run 181509) is not a bar
bar_clear_m: 0.8                     # nothing higher than the bar within this behind its front edge
bar_half_w: 0.45
bar_cover: 0.6                       # share of the 0.1 m lane slices that must show the bar
bar_range_m: 1.6
bar_trigger_m: 1.0                   # start squaring up when the front edge is this near
bar_hist: 6
bar_deep_memory: 40                  # scans (4 s): an object seen as deeper than bar_depth_max stays rejected
bar_persist: 4
bar_vx: 0.20
bar_extra_m: 0.55                    # travel past the far edge (dog length behind the base point)
bar_hold_err_deg: 15                 # crossing is straight: more heading error than this -> HOLD
bar_no_progress_s: 3.0

# ---- curtain (rc/curtain.py + rc/vision_node.py: best.pt detects it, the lidar must show a face) ----
curtain: push                        # off | detect | push
curtain_conf: 0.50
curtain_persist: 3                   # detections within curtain_window_s
curtain_window_s: 1.5
curtain_cone_deg: 25
curtain_min_m: 0.4
curtain_max_m: 2.0
curtain_min_w: 0.5                   # face width (m) the lidar must show
curtain_trigger_m: 1.3
curtain_vx: 0.12
curtain_through_m: 0.6               # base travel past the face (half the body 0.27 + legs + margin); also bounds a push into a wall
curtain_ignore_m: 0.45               # the guard ignores obstacles this far behind the face while pushing
curtain_stall_s: 3.0                 # no closing on the face for this long while walking -> it is a wall
curtain_stall_close_m: 0.05
curtain_cooldown_s: 30.0             # after a stall the camera is ignored this long
curtain_hold_err_deg: 15
cam_hfov_deg: 70.0                   # camera horizontal field of view (UNVERIFIED - measure on the dog)
cam_topic: /camera/color/image_raw
cam_model: best.pt
cam_conf: 0.35
cam_hz: 5.0
detections_topic: /rc/detections

# ---- start-up / posture (spec section 4) ----
knee_names: [LF_Joint_2, RF_Joint_2, LB_Joint_2, RB_Joint_2]
sit_knee: -2.4                       # mean knee below this = sitting (~ -2.75 measured)
stand_knee: -1.6                     # mean knee above this = standing (~ -1.29 measured)
settle_s: 1.0
settle_vel: 0.05
stand_timeout_s: 15.0
test_wz: 0.30                        # start-up / gait turn test
test_s: 1.5                          # from standing the dog needs ~0.5 s to start turning (060242)
test_ratio: 0.5
simple_cmd_gap_s: 0.4
simple_cmd_qos: transient_local      # the /simple_cmd bridge (lite3_domain_bridge_1) is TRANSIENT_LOCAL: volatile codes were dropped
# AI state (stairs): the dog ignores /cmd_vel; it is driven by axis commands on /simple_cmd (value in
# 'size') at cmd_rate_hz, both axes every time, control mode manual (2026-11-23 hand tests).
# axis value = dead zone + gain * speed; gains from forward 25000 ~ 0.33 m/s, turn 15000 ~ 0.45 rad/s (rough)
ai_fwd_dz: 6553
ai_fwd_gain: 56000                   # per m/s
ai_turn_dz: 9553
ai_turn_gain: 12000                  # per rad/s

# ---- viewer / recording (spec sections 8b, 11) ----
viewer: true
viewer_port: 8081
snapshot_hz: 2.0
record: true
record_camera: false
