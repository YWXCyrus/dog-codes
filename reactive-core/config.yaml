# reactive-core parameters (flat keys). Override any value on the command line:
#   python3 run.py --set step_limit=0.20 --set wall_side=right
# Values come from the design spec (docs/specs/2026-11-20-reactive-nav-design.md).

# ---- sensing (spec section 5) ----
mount_xyz: [0.18678, 0.0, 0.12498]   # base_link -> livox_frame, from /tf_static (session 1)
mount_pitch_deg: 15.0                # replaced by /tf_static when it arrives
near_drop_m: 0.30                    # drop points this close to the sensor (zero-range blob; 0.15 let the front legs in: 103 vs 32 front stops replaying run 113959)
max_range_m: 6.0
patch_m: 0.30                        # local-ground patch size
ground_pct: 10                       # local ground = this percentile of a patch's heights
step_limit: 0.25                     # higher than this above local ground = obstacle (tune practice day 1)
obs_h_max: 1.20                      # above local ground; higher returns (ceiling) ignored
n_min: 5                             # points needed in a cell to call it an obstacle
obs_cell_m: 0.10
persist_k: 1                         # obstacle cell must be seen in persist_k ... (1/1 = off, 2026-11-23)
persist_n: 1                         # ... of the last persist_n scans
body_h_default: 0.32                 # base_link height above the floor until the legs give one (floor_src fixed: always)
floor_src: legs                      # legs = body height from /joint_states (follows the controller height) | fixed
thigh_m: 0.20                        # Lite3_rl_deploy lite3_control_parameters.cpp
shank_m: 0.21
leg_h_add: 0.0                       # added to the leg height (foot radius, hip offset)
stairs_trust_m: 0.80                 # STAIRS mode: a patch's own ground is trusted within this of the stance floor

# ---- FAST-LIO local map (replaces the short-term obstacle memory, 2026-11-23) ----
lio_restart: true                    # run.py stops any running FAST-LIO and starts a fresh one per run (not with --sim)
lio_cmd: ros2 launch lite3_launcher fast_lio.launch.py
lio_topic: /fastlio/odometry         # nav_msgs/Odometry, lidar pose in lidar_init
lio_wait_s: 10.0                     # start-up waits this long for the first FAST-LIO pose (else: live scan only)
lio_blind_m: 0.50                    # map stores no point nearer than this to the sensor (own legs; FAST-LIO blind)
lio_voxel_m: 0.05
lio_radius_m: 3.0                    # map kept within this of the dog ...
lio_time_s: 30.0                     # ... and this long
lio_max_speed: 1.0                   # FAST-LIO pose faster than this (0.3 s window) = diverged -> map off for the run
lio_jump_m: 0.50                     # ... or one pose step longer than this
lio_stale_s: 0.50                    # map not used when the latest pose is older than this

# ---- leg odometry (grid, progress check) ----
odom_topic: /leg_odom
odom_type: pose                      # pose = PoseWithCovarianceStamped (/leg_odom) | odometry = nav_msgs/Odometry (/leg_odom2)
odom_jump_m: 0.30
yaw_source: gyro                     # gyro (integrated /imu/data, started from the first odom yaw) | odom
odom_speed_factor: 1.5
odom_speed_add: 0.30

# ---- lanes / driving (spec section 6) ----
lane_w: 0.60                         # start bay walls at +0.45 / -0.55 m (run 20261123_034135): ~0.9 m free
lane_w_min: 0.50
lane_d: 1.0
lane_fov_deg: 135                    # lanes evaluated within +-this (the rear is blind)
lane_step_deg: 15
rate_hz: 10.0                        # driver decisions
cmd_rate_hz: 20.0                    # command output
cruise_vx: 0.20
cruise_vx_min: 0.20                   # = cruise_vx: constant speed
# turn on the spot OR walk straight, never both (2026-11-23: slips at ledges while doing both)
turn_wz: 0.40
turn_wz_min: 0.20                    # turn rate in the last turn_slow_deg (the dog answers ~0.3 s late)
turn_slow_deg: 20                    # below this heading error the turn slows towards turn_wz_min
head_err_turn_deg: 10                # walking straight: heading error above this -> stop, turn on the spot
turn_done_deg: 4                     # ... until the error is below this (also the stairs approach)
commit_s: 2.0
blocked_confirm_n: 3                 # BLOCKED ends only when a lane is free this many decisions in a row (061517: one-scan flickers -> dither)
blocked_memory_s: 5.0                # BLOCKED again within this: keep the turn direction and the turned angle (no left-right-left)
wall_side: left                     # left | right (arenas are mirrored)
wall_dist_m: 0.60
side_switch_s: 60.0                  # no new grid cell for this long -> switch wall side
progress_s: 3.0
progress_ratio: 0.2
run_time_s: 0.0                      # > 0: HOLD after this many seconds (0 = off)

# ---- guard (spec section 7): stale feeds, tilt, no reverse, front stop - nothing else ----
stop_m: 0.24                         # from the sensor: nose ~0.14 m ahead of it -> ~0.10 m nose gap
guard_corridor_margin_m: 0.05
footprint_w: 0.42                    # front-stop corridor width (+ margin)
stale_s: 0.30
tilt_stop_deg: 45                    # above: zero command (flat and stairs) ... (35 was too close: sim descent peaks 32-35 deg)
tilt_resume_deg: 40                  # ... until below this, then it drives on by itself. Must stay above the pitch of a dog
                                     # standing on the stairs (real 27-31, sim up to ~35 deg), or it never resumes there
tilt_latch_deg: 60                   # above: the dog is going over - stopped until restart

# ---- grid (spec section 8) ----
cell_m: 1.0

# ---- stairs (spec section 9) ----
stairs: climb                        # off | detect | climb
stair_rise_min: 0.08
stair_rise_max: 0.20
stair_min_rises: 2
stair_bin_m: 0.05                    # fine bins: riser faces fall into short runs that are dropped
stair_tread_min: 0.15                # a plateau reached by a rise must be this long (wall faces are shorter)
stair_persist: 5
stair_start_excl_m: 1.5
stair_standoff_m: 0.60
stair_look_s: 2.0
stair_vx_up: 0.15
stair_vx_down: 0.10
stair_flat_exit_m: 1.0
stair_max_s: 90.0
stair_no_progress_s: 3.0
stair_hold_err_deg: 15               # climb / descend walk straight, never turn on a step: heading error above this -> HOLD (stays in AI)

# ---- GRID NAVIGATION (branch grid-nav, 2026-11-26): arena map + grid snap + cell planner ----
# nav_mode grid: the dog drives cell centre to cell centre over its own map of the 3 x 5 (+1) arena
# (rc/arena.py, rc/localize.py, rc/cellplan.py, rc/cellnav.py). nav_mode wall: the old wall following.
nav_mode: grid                       # grid | wall
arena_cell_m: 1.02                   # booklet v6.4 E: cell centres 1.02 m apart (1.00 m panels + 0.02 m posts)
arena_long: 5                        # 3 x 5 cells, start cell in the first row (booklet H)
arena_short: 3
pose_src: leg                        # leg (leg odometry + gyro yaw) | lio (FAST-LIO base pose, falls back to leg)
loc_jump_m: 0.30                     # an odometry step longer than this is a jump, not a motion
loc_step: auto                       # odom: split odometry steps with its own yaw | forward: step length along the gyro heading | auto: odom, forward if its yaw does not follow the gyro
hyp_pen_slack: 0                     # placements this many penalty points worse than the best are dropped
hyp_open_min: 100000                 # rays through an OPEN border into a cell outside a placement penalise it (100000 = off: live 2026-11-26 it fixed wrong bounds after 9 s)
visit_r_m: 0.40                      # cell visited = base_link within this of its centre
visit_blocked_r_m: 0.80              # ... or within this when an obstacle in the cell stops it (a prop)
seen_min_n: 30                       # floor returns inside a cell -> 'seen' (viewer)
terrain_range_m: 1.6                 # terrain (flat / uneven / elevated) only from returns this near
# border evidence (heights above the stance floor). Panel (0.43 m): MID hit, UP pass. Curtain (0.15-0.93 m): MID + UP hit.
edge_range_m: 3.0
edge_max_pts: 3000
edge_mid_lo: 0.20                    # panel band: course panels are 0.43 m high (measured 2026-11-27)
edge_mid_hi: 0.38
edge_up_lo: 0.55                     # above the panels: only the curtain (0.15 - 0.93 m, measured) is here
edge_up_hi: 0.85
edge_tol_m: 0.06                     # a return within this of the border line is ON it
edge_margin_m: 0.12                  # border ends (posts, corners) ignored
edge_cap_per_scan: 30
edge_count_max: 400                  # evidence is rescaled above this (new scans can still flip a state)
edge_n_min: 12
edge_wall_ratio: 0.60                # MID hits / (hits + passes) >= this -> WALL
edge_open_ratio: 0.30                # <= this -> OPEN (or CURTAIN if the UP band is blocked)
edge_curtain_up_ratio: 0.60
edge_tall_curtain: true              # blocked in the panel band AND above the panel top -> CURTAIN (floor-length cloth)
edge_tall_ratio: 0.30                # ... only if the hits above are >= this share of the panel-band hits (dense cloth)
observe_hz: 2.0
# grid snap (position + heading from the panels; rc/localize.py)
snap: true
snap_hz: 3.0
snap_z_lo: 0.18                      # wall returns: height above the stance floor (panels 0.43 m)
snap_z_hi: 0.40
snap_range_m: 2.5
snap_max_pts: 1500
snap_min_pts: 60
snap_yaw_max_deg: 6.0
snap_yaw_gain_min: 0.02              # the best rotation must sharpen the histograms by 2 %
snap_peak_min: 15                    # points in a panel peak
snap_peak_span_m: 0.35               # a panel peak must be this long (props / posts are shorter) ...
snap_peak_fill: 0.70                 # ... and continuous over this share of it (not two side walls)
snap_agree_m: 0.08                   # panel offsets on one axis must agree within this
snap_max_off_m: 0.25                 # offsets beyond this are not panels on border lines
snap_gain: 0.5
snap_cap_deg: 2.0                    # per update
snap_cap_m: 0.08
snap_max_wz: 0.15                    # no snap while turning faster (smeared scan)
snap_max_tilt_deg: 8.0
# planner (rc/cellplan.py)
plan_turn_cost: 0.3                  # per 90 deg
plan_unknown_cost: 0.5
plan_curtain_cost: 2.0
plan_stairs_cost: 12.0               # stairs are crossed when nothing else is left on this side
plan_tour_weight: 1.0                # 0 = nearest target; 1 = nearest + greedy tour of the rest
plan_first_k: 6                      # the tour scores only the nearest this-many targets as the next goal
plan_max_cells: 7
plan_period_s: 1.0
plan_min_gap_s: 0.5                  # forced replans at most this often (a stuck loop must not load the CPU)
plan_commit_margin: 1.0              # keep the current goal unless another is this much cheaper
explore_budget_s: 450.0              # after this (minus the drive there) go to the final cell; 0 = never
budget_margin_s: 30.0
eta_cell_s: 2.0                      # time estimates: extra per cell (pause, slowing) ...
eta_turn_s: 4.0                      # ... per 90 deg turn ...
eta_stairs_s: 60.0                   # ... for the stairs sequence
# navigator (rc/cellnav.py)
arrive_tol_m: 0.10
centre_tol_m: 0.15                   # big turns only this close to a cell centre (turn circle ~0.39 m)
grid_vx_near: 0.12                   # last 0.35 m to a centre
grid_lookahead_m: 0.80               # aim point on the cell centre line this far ahead
grid_run_cells: 3                    # straight runs through visited cells without stopping
walk_wz_max: 0.0                     # > 0: steer up to this while walking (guard allows it); 0 = turn OR walk
walk_wz_k: 1.0
grid_prog_s: 3.0                     # walking this long ...
grid_prog_m: 0.08                    # ... with less progress -> border blocked, replan
grid_max_fails: 4                    # failures within 40 s -> HOLD no_progress
grid_block_s: 25.0                   # a blocked border is avoided this long
grid_block_evidence: 15.0            # WALL evidence added to a border the lane check found blocked
grid_obst_stop_m: 0.45               # an obstacle inside a cell: creep up to this free distance, then count it visited
grid_realign_s: 0.8                  # a blocked border: square up to the axis, stand this long (snap), look again
grid_back_max_m: 0.80               # then back straight to the previous centre (over the ground just walked); 0 = off
grid_back_vx: 0.12                   # (0.08 did not move the real dog, live 2026-11-26)
grid_back_give_up_s: 2.5             # not moving backwards after this: give up backing, plan on
cur_detour: 3.0                      # a detected curtain is crossed once if its near side costs at most this (or nothing else is left); <0 = never
cell_pause_s: 1.0                    # still at every new cell centre (perception: scene query)
grid_use_lio_map: false              # grid lanes use the FAST-LIO map too (live 2026-11-26: map went BAD, ghosts); false also saves its CPU
grid_fallback_s: 15.0                # no plan: reactive wall following this long, then plan again
# curtain: border CURTAIN from the lidar (open below the hem, cloth above) or the camera
curtain: push                        # off | detect | push
cur_cue_min: 3.0                     # camera curtain detections pointing at a wall-like border -> CURTAIN
cur_cue_angle_deg: 50.0              # ... only when the camera ray meets the border within this of square
cur_ask_camera: true                 # lidar-only curtain: ask perception's camera first (no answer -> push)
cur_vlm_wait_s: 8.0
cur_probe: true                      # exploration done, arena cells unvisited behind a wall: ask the camera
cur_probe_touch: false               # ... and with no camera answer push anyway (touch test)
cur_push_vx: 0.12
cur_ignore_m: 0.35                   # the guard ignores returns this far beyond the border while pushing
cur_clear_m: 0.45                    # passed when base_link is this far beyond the border
cur_nose_m: 0.30                     # base_link -> nose
cur_stall_m: 0.04                    # touch test: less progress than this ...
cur_stall_s: 2.0                     # ... in this long while pushing = rigid (a wall)
cur_retreat_m: 0.15                  # after 'rigid': back off this far (the ONLY reverse; 0 = off)
cur_retreat_vx: 0.08
cur_max_s: 30.0
curtain_hold_err_deg: 15
# QR (M04): in a survivor room (perception) with the QR not read, look at its walls
qr_look: true
qr_look_on_seen: true                # also when perception located a QR it could not read
qr_look_s: 2.5
qr_look_skew_deg: 35.0               # second look skewed towards the entrance half (booklet: nearer half)
# camera model detections (/rc/detections from rc/vision_node.py, best.pt)
cam_det_conf: 0.5
cam_det_n: 3
cam_det_window_s: 1.5
cam_det_cone_deg: 20.0
# stairs in grid mode: the planner decides when; the driver's stairs sequence crosses
stair_wait_s: 4.0                    # squared up before the stairs: wait this long for the lidar detector ...
stairs_grid_fallback: true           # ... then approach on the grid (border = first riser) instead of HOLD
stairs_ask_camera: true              # a blocked OPEN border: ask the camera whether it is stairs
publish_arena_odom: true             # /rc/odom (nav_msgs/Odometry, arena frame) for perception's positions

# ---- start-up / posture (spec section 4) ----
knee_names: [LF_Joint_2, RF_Joint_2, LB_Joint_2, RB_Joint_2]
sit_knee: -2.4                       # mean knee below this = sitting (~ -2.75 measured)
stand_knee: -1.6                     # mean knee above this = standing (~ -1.29 measured)
settle_s: 1.0
settle_vel: 0.05
stand_timeout_s: 15.0
test_wz: 0.30                        # start-up / gait turn test
test_s: 1.5                          # from standing the dog needs ~0.5 s to start turning (060242)
test_ratio: 0.5
simple_cmd_gap_s: 0.4
simple_cmd_qos: transient_local      # the /simple_cmd bridge (lite3_domain_bridge_1) is TRANSIENT_LOCAL: volatile codes were dropped
# AI state (stairs): the dog ignores /cmd_vel; it is driven by axis commands on /simple_cmd (value in
# 'size') at cmd_rate_hz, both axes every time, control mode manual (2026-11-23 hand tests).
# axis value = dead zone + gain * speed; gains from forward 25000 ~ 0.33 m/s, turn 15000 ~ 0.45 rad/s (rough)
ai_fwd_dz: 6553
ai_fwd_gain: 56000                   # per m/s
ai_turn_dz: 9553
ai_turn_gain: 12000                  # per rad/s

# ---- viewer / recording (spec sections 8b, 11) ----
viewer: true
viewer_port: 8081
snapshot_hz: 2.0
record: true
record_camera: false
